name: Roma release qualification
on:
  pull_request:
    paths:
      - .github/workflows/roma-qualification.yml
  workflow_dispatch:
    inputs:
      version:
        description: Exact published Roma release tag
        required: true
        type: string
      source:
        description: Full Roma source commit for the release
        required: true
        type: string
      sha256:
        description: Reviewed Linux AMD64 archive SHA-256
        required: true
        type: string
permissions:
  contents: read
jobs:
  release-access:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Mint a Roma release-read token
        id: roma_read
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FASTVERK_APP_ID }}
          private-key: ${{ secrets.FASTVERK_APP_PRIVATE_KEY }}
          owner: tomato-bazel
          repositories: roma
          permission-contents: read
      - name: Verify access to the published prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ steps.roma_read.outputs.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/tomato-bazel/roma/releases/tags/v0.1.0-alpha.3 --jq '.tag_name')
          test "$tag" = v0.1.0-alpha.3
      - name: Verify the installed prerelease starts on Linux AMD64
        id: prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ steps.roma_read.outputs.token }}
        run: |
          set -euo pipefail
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          scratch=$(mktemp -d "$RUNNER_TEMP/roma-prerelease.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          gh release download v0.1.0-alpha.3 --repo tomato-bazel/roma \
            --pattern roma-linux-amd64 --dir "$scratch"
          unset GH_TOKEN
          sum=$(sha256sum "$scratch/roma-linux-amd64")
          test "${sum%% *}" = 717447c0b47b81f6d5b98e02a00b8e60518a9d62613f23dba31456865114e5c1
          install -m 0755 "$scratch/roma-linux-amd64" "$scratch/roma"
          test "$("$scratch/roma" --version)" = 'roma 0.1.0-alpha.3'
          printf 'executable=%s\n' "$scratch/roma" >> "$GITHUB_OUTPUT"
          trap - EXIT
      - name: Check the current prerelease against consumer targets
        shell: bash
        env:
          ROMA: ${{ steps.prerelease.outputs.executable }}
        run: |
          set -euo pipefail
          "$ROMA" build //...
          "$ROMA" test //...

  qualify:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.ROMA_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Mint a Roma release-read token
        id: roma_read
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FASTVERK_APP_ID }}
          private-key: ${{ secrets.FASTVERK_APP_PRIVATE_KEY }}
          owner: tomato-bazel
          repositories: roma
          permission-contents: read
      - name: Run the released Roma CLI
        id: roma
        uses: tomato-bazel/setup-tbzl/roma@428328ffda053d43c00e466a6665ead1bec9efd5
        with:
          version: ${{ inputs.version }}
          source: ${{ inputs.source }}
          sha256: ${{ inputs.sha256 }}
          release-token: ${{ steps.roma_read.outputs.token }}
      - name: Repeat with warm and fresh workspaces
        shell: bash
        env:
          ROMA: ${{ steps.roma.outputs.executable }}
        run: |
          set -euo pipefail
          "$ROMA" build //...
          "$ROMA" test //...
          clean_workspace=$(mktemp -d "$RUNNER_TEMP/rules-tla-repeat.XXXXXX")
          trap 'rm -rf "$clean_workspace"' EXIT
          git archive HEAD | tar -x -C "$clean_workspace"
          test ! -e "$clean_workspace/roma-out"
          "$ROMA" build //... --workspace "$clean_workspace"
          "$ROMA" test //... --workspace "$clean_workspace"
      - name: Verify failure propagation on the existing negative fixture
        shell: bash
        env:
          ROMA: ${{ steps.roma.outputs.executable }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/roma-invariant-probe.log"
          if "$ROMA" build //examples/failure:must_fail_probe.run 2>&1 | tee "$log"; then
            echo "::error::The intentionally failing target built successfully."
            exit 1
          fi
          grep -Fq "rules_tla: expected ok, TLC produced invariant_violation" "$log"
