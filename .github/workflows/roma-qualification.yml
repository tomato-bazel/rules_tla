name: Roma release qualification
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published Roma release tag
        required: true
        type: string
      source:
        description: Full Roma source commit for the release
        required: true
        type: string
      sha256:
        description: Reviewed Linux AMD64 archive SHA-256
        required: true
        type: string
permissions:
  contents: read
jobs:
  qualify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.ROMA_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Mint a Roma release-read token
        id: roma_read
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FASTVERK_APP_ID }}
          private-key: ${{ secrets.FASTVERK_APP_PRIVATE_KEY }}
          owner: tomato-bazel
          repositories: roma
          permission-contents: read
      - name: Run the released Roma CLI
        id: roma
        uses: tomato-bazel/setup-tbzl/roma@428328ffda053d43c00e466a6665ead1bec9efd5
        with:
          version: ${{ inputs.version }}
          source: ${{ inputs.source }}
          sha256: ${{ inputs.sha256 }}
          release-token: ${{ steps.roma_read.outputs.token }}
      - name: Repeat with warm and fresh workspaces
        shell: bash
        env:
          ROMA: ${{ steps.roma.outputs.executable }}
        run: |
          set -euo pipefail
          "$ROMA" build //...
          "$ROMA" test //...
          clean_workspace=$(mktemp -d "$RUNNER_TEMP/rules-tla-repeat.XXXXXX")
          trap 'rm -rf "$clean_workspace"' EXIT
          git archive HEAD | tar -x -C "$clean_workspace"
          test ! -e "$clean_workspace/roma-out"
          "$ROMA" build //... --workspace "$clean_workspace"
          "$ROMA" test //... --workspace "$clean_workspace"
      - name: Verify failure propagation on the existing negative fixture
        shell: bash
        env:
          ROMA: ${{ steps.roma.outputs.executable }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/roma-invariant-probe.log"
          if "$ROMA" build //examples/failure:must_fail_probe.run 2>&1 | tee "$log"; then
            echo "::error::The intentionally failing target built successfully."
            exit 1
          fi
          grep -Fq "rules_tla: expected ok, TLC produced invariant_violation" "$log"
